name: Update UFRA catalog

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Refresh product data
        run: python scripts/update_ufra_catalog.py
      - name: Commit and publish changes
        run: |
          if [[ -n "$(git status --porcelain products-data.js)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add products-data.js
            git commit -m "Update UFRA catalog"
            git push origin main
            git push origin main:gh-pages
          else
            echo "No product changes detected."
          fi
